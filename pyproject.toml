[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-com-test-wrappers"
version = "0.1.0"
description = "Python wrappers for testing automotive communication modules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
peak = [
    "python-can>=4.2",
    "plin-linux>=0.0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
